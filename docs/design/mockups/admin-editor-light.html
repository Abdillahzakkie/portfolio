<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FBFAF7">
<title>Admin — Post editor (light)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBFAF7; --bg-elevated:#FFFFFF; --surface:#FFFFFF; --surface-2:#F2F0EA;
  --text:#1A1A1E; --text-muted:#55555F; --text-faint:#7C7C86;
  --border:#E3E0D8; --border-strong:#CFCBC0; --ring:#4F46E5;
  --cluster-web3-text:#4F46E5; --success:#047857; --warning:#B45309; --info:#4F46E5;
  --font-display:'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
  --font-body:'Inter', ui-sans-serif, system-ui, sans-serif;
  --font-mono:'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
  --radius-sm:6px; --radius-md:10px; --radius-lg:16px; --radius-full:9999px;
  --elev-1:0 1px 2px rgba(20,20,30,.06);
  color-scheme:light;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg); color:var(--text); font-family:var(--font-body); font-size:16px; -webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none;}
.shell{display:grid; grid-template-columns:240px 1fr; min-height:100vh;}
.sidebar{background:var(--bg-elevated); border-right:1px solid var(--border); padding:20px 14px; display:flex; flex-direction:column;}
.sb-brand{display:flex; align-items:center; gap:9px; font-family:var(--font-display); font-weight:700; font-size:19px; padding:6px 10px 20px;}
.sb-brand .glyph{color:var(--cluster-web3-text);}
.sb-brand .sep{color:var(--text-faint); font-weight:500; font-size:15px;}
.sb-nav{display:flex; flex-direction:column; gap:2px;}
.sb-nav a{display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:var(--radius-md); font-size:14.5px; font-weight:500; color:var(--text-muted);}
.sb-nav a:hover{background:var(--surface-2); color:var(--text);}
.sb-nav a.active{background:color-mix(in srgb, var(--info) 10%, transparent); color:var(--info); font-weight:600;}
.main{display:flex; flex-direction:column; min-width:0;}
.topbar{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:14px 28px; border-bottom:1px solid var(--border); background:var(--bg-elevated); position:sticky; top:0; z-index:10;}
.tb-left{display:flex; align-items:center; gap:14px;}
.crumb{display:inline-flex; align-items:center; gap:7px; color:var(--text-muted); font-size:14px; font-weight:500;}
.status-switch{display:inline-flex; align-items:center; gap:7px; height:34px; padding:0 12px; border:1px solid var(--border-strong); border-radius:var(--radius-full); background:color-mix(in srgb, var(--warning) 12%, transparent); color:var(--warning); font-size:13px; font-weight:600; cursor:pointer;}
.status-switch .sdot{width:7px; height:7px; border-radius:50%; background:currentColor;}
.tb-right{display:flex; align-items:center; gap:10px;}
.btn{display:inline-flex; align-items:center; gap:7px; height:40px; padding:0 18px; border-radius:var(--radius-md); font-family:var(--font-body); font-weight:600; font-size:14px; cursor:pointer; border:1px solid transparent;}
.btn.secondary{background:var(--surface); border-color:var(--border-strong); color:var(--text);}
.btn.primary{background:var(--info); color:#fff;}
.panes{display:grid; grid-template-columns:1fr 340px; gap:0; flex:1; min-height:0;}
.editor{padding:32px 40px; border-right:1px solid var(--border); min-width:0;}
.title-input{width:100%; border:none; outline:none; background:transparent; font-family:var(--font-display); font-weight:700;
  font-size:38px; letter-spacing:-.02em; color:var(--text); line-height:1.15; margin-bottom:18px;}
.title-input::placeholder{color:var(--text-faint);}
.toolbar{display:flex; align-items:center; gap:2px; padding:6px; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-md); margin-bottom:14px; flex-wrap:wrap;}
.toolbar button{min-width:34px; height:34px; padding:0 9px; border:none; background:transparent; border-radius:7px; color:var(--text); font-size:14px; cursor:pointer; display:grid; place-items:center; font-family:var(--font-body);}
.toolbar button:hover{background:var(--bg-elevated);}
.toolbar button[aria-pressed="true"]{background:var(--bg-elevated); box-shadow:var(--elev-1); color:var(--info);}
.toolbar .b{font-weight:700;} .toolbar .i{font-style:italic;} .toolbar .code{font-family:var(--font-mono); font-size:12px;}
.toolbar .divider{width:1px; height:20px; background:var(--border-strong); margin:0 6px;}
.body-area{width:100%; min-height:440px; border:1px solid var(--border); border-radius:var(--radius-md); background:var(--surface);
  padding:18px 20px; font-family:var(--font-mono); font-size:14px; line-height:1.7; color:var(--text); resize:vertical; outline:none;}
.body-area:focus{outline:2px solid var(--ring); outline-offset:2px;}
.autosave{display:flex; align-items:center; gap:8px; margin-top:12px; font-size:12.5px; color:var(--text-faint);}
.autosave .dot{width:6px; height:6px; border-radius:50%; background:var(--success);}
/* settings aside */
.settings{padding:26px 24px; background:var(--bg-elevated); overflow-y:auto;}
.settings h2{font-family:var(--font-display); font-weight:700; font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-faint); margin:0 0 16px;}
.sfield{margin-bottom:18px;}
.sfield label{display:block; font-size:12.5px; font-weight:600; color:var(--text); margin-bottom:6px;}
.sfield input,.sfield select,.sfield textarea{width:100%; padding:9px 11px; font-family:var(--font-body); font-size:13.5px; color:var(--text);
  background:var(--surface); border:1px solid var(--border-strong); border-radius:var(--radius-sm); outline:none;}
.sfield input:focus,.sfield select:focus,.sfield textarea:focus{outline:2px solid var(--ring); outline-offset:1px;}
.sfield .hint{font-size:11.5px; color:var(--text-faint); margin-top:4px;}
.sfield.mono input{font-family:var(--font-mono); font-size:12.5px;}
.taglist{display:flex; flex-wrap:wrap; gap:6px; margin-top:2px;}
.tagpill{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:4px 8px; border-radius:var(--radius-full); background:color-mix(in srgb, var(--cluster-web3-text) 12%, transparent); color:var(--cluster-web3-text);}
.tagpill .x{cursor:pointer; opacity:.7;}
.tagadd{font-size:11.5px; font-weight:600; padding:4px 10px; border-radius:var(--radius-full); border:1px dashed var(--border-strong); background:transparent; color:var(--text-muted); cursor:pointer;}
.cover-drop{border:1.5px dashed var(--border-strong); border-radius:var(--radius-md); padding:20px; text-align:center; color:var(--text-faint); font-size:12.5px; background:var(--surface-2);}
.readtime{display:flex; align-items:center; justify-content:space-between; font-size:13px; padding:10px 12px; background:var(--surface-2); border-radius:var(--radius-sm); color:var(--text-muted);}
.readtime b{color:var(--text); font-weight:600;}
.divider-h{height:1px; background:var(--border); margin:22px 0;}
.required{color:var(--info); font-weight:700;}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="sb-brand"><span class="glyph">◆</span> AZ <span class="sep">· Admin</span></div>
    <nav class="sb-nav" aria-label="Admin sections">
      <a href="#" class="active" aria-current="page"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg> Posts</a>
      <a href="#"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7l9-4 9 4-9 4-9-4zM3 7v10l9 4 9-4V7"/></svg> Projects</a>
      <a href="#"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg> Media</a>
      <a href="#"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 6.6 19l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 4 13.6H4a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 5 6.6l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 10.4 4V4a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg> Settings</a>
    </nav>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="tb-left">
        <a class="crumb" href="#"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg> Posts</a>
        <button class="status-switch" aria-haspopup="menu"><span class="sdot"></span> Draft <span aria-hidden="true">▾</span></button>
      </div>
      <div class="tb-right">
        <button class="btn secondary">Save</button>
        <button class="btn primary">Publish</button>
      </div>
    </div>

    <div class="panes">
      <div class="editor">
        <input class="title-input" value="A 2-of-3 non-custodial escrow" aria-label="Post title">
        <div class="toolbar" role="toolbar" aria-label="Formatting">
          <button class="b" aria-label="Bold" aria-pressed="false">B</button>
          <button class="i" aria-label="Italic" aria-pressed="false">I</button>
          <span class="divider"></span>
          <button aria-label="Heading 2" aria-pressed="true">H2</button>
          <button aria-label="Quote">&ldquo;</button>
          <button class="code" aria-label="Code block">&lt;/&gt;</button>
          <button aria-label="Horizontal rule">—</button>
          <span class="divider"></span>
          <button aria-label="Insert image"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg></button>
          <button aria-label="Insert link"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg></button>
        </div>
        <textarea class="body-area" aria-label="Post body (Markdown / MDX)">## The trust problem

A peer-to-peer trade needs an escrow that **no single party** can drain — not the
buyer, not the seller, and not the platform. Settleo solves this with a 2-of-3
multisig escrow: any two of the three keys can release funds.

```solidity
function release(bytes32 tradeId, Sig[2] calldata approvals)
    external
{
    require(_verify(tradeId, approvals) >= 2, "need 2 of 3");
    _settle(tradeId);
}
```

> The orchestrator drives fund / release / refund / dispute, then settles the
> result back against the ledger.

Next up: how disputes escalate to 2-of-3 arbitration.</textarea>

      </div>

      <aside class="settings" aria-label="Post settings">
        <h2>Settings</h2>

        <div class="sfield mono">
          <label for="slug">Slug</label>
          <input id="slug" value="a-2-of-3-non-custodial-escrow">
          <div class="hint">Auto from title · editable · must be unique.</div>
        </div>

        <div class="sfield">
          <label for="project">Project <span class="required" title="required">*</span></label>
          <select id="project"><option>Settleo Escrow</option><option>Settleo</option><option>GKOI Contracts</option><option>Sentova</option></select>
          <div class="hint">Links the post back to its project (required).</div>
        </div>

        <div class="sfield">
          <label for="domain">Domain</label>
          <select id="domain"><option>◆ Web3</option><option>▲ Security</option><option>● Commerce</option><option>✦ Tools / Labs</option></select>
        </div>

        <div class="sfield">
          <label>Tags</label>
          <div class="taglist">
            <span class="tagpill">Solidity <span class="x" aria-hidden="true">×</span></span>
            <span class="tagpill">Foundry <span class="x" aria-hidden="true">×</span></span>
            <button class="tagadd">＋ add</button>
          </div>
        </div>

        <div class="sfield">
          <label for="excerpt">Excerpt</label>
          <textarea id="excerpt" rows="3">Designing trade escrow so no single party — buyer, seller, or platform — can move funds alone.</textarea>
        </div>

        <div class="sfield">
          <label>Cover</label>
          <div class="cover-drop">Drop an image or <u>browse</u> · 1600×900</div>
        </div>

        <div class="divider-h"></div>

        <div class="sfield">
          <label for="seotitle">SEO title</label>
          <input id="seotitle" value="A 2-of-3 non-custodial escrow — Settleo">
        </div>
        <div class="sfield">
          <label for="seodesc">SEO description</label>
          <textarea id="seodesc" rows="2">How Settleo escrows trades with a 2-of-3 multisig so funds can never move unilaterally.</textarea>
        </div>

        <div class="readtime"><span>Read time</span><b>7 min · auto</b></div>
      </aside>
    </div>
  </div>
</div>
</body>
</html>
